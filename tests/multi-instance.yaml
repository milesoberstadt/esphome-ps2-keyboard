esphome:
  name: ps2-multi-instance-test

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

external_components:
  - source:
      type: local
      path: ../components

api:
  custom_services: true

wifi:
  ssid: "test-network"
  password: "test-password"

logger:

ps2_keyboard:
  - id: first_keyboard
    clk_pin: GPIO4
    data_pin: GPIO5
    service_prefix: first
  - id: second_keyboard
    clk_pin: GPIO6
    data_pin: GPIO7
    service_prefix: second
